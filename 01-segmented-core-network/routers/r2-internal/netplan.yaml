# /etc/netplan/01-r2.yaml (chmod 600)
# Switch ports carry no IP; gateway IPs live on the OVS SVIs (see ovs-l3.sh).
network:
  version: 2
  renderer: networkd
  ethernets:
    ens33:            # transit access port (VLAN 99)
      dhcp4: false
      dhcp6: false
      link-local: []
      optional: true
    ens37:            # Users access port (VLAN 10)
      dhcp4: false
      dhcp6: false
      link-local: []
      optional: true
    ens38:            # Infrastructure access port (VLAN 20)
      dhcp4: false
      dhcp6: false
      link-local: []
      optional: true
