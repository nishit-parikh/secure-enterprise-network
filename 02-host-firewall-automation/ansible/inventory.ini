# Hosts grouped by security zone; each zone maps to an 802.1Q VLAN.
# Control node: mgmt (10.10.10.14). Linux hosts are reached over SSH as "ubuntu".

[infra]
dns-dhcp ansible_host=10.10.10.11
file     ansible_host=10.10.10.12
internal ansible_host=10.10.10.13
mgmt     ansible_host=10.10.10.14 ansible_connection=local   # the control node firewalls itself

[dmz]
public     ansible_host=10.10.30.10
shop       ansible_host=10.10.30.11
dns-public ansible_host=10.10.30.12

[linux:children]
infra
dmz

[linux:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3

# Routers r1/r2 keep their hand-written zone rulesets from stage 01 and are
# deliberately NOT in this inventory: this template is for endpoints only.

# Windows hosts are managed over WinRM (NTLM). Credentials live in Ansible Vault.
[windows]
ad ansible_host=10.10.10.10

[clients]
admin ansible_host=172.16.0.2

[windows:vars]
ansible_connection=winrm
ansible_port=5985
ansible_winrm_transport=ntlm
ansible_winrm_scheme=http
ansible_winrm_server_cert_validation=ignore
ansible_become=false

[clients:vars]
ansible_connection=winrm
ansible_port=5985
ansible_winrm_transport=ntlm
ansible_winrm_scheme=http
ansible_winrm_server_cert_validation=ignore
ansible_become=false
