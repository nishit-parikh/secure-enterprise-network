#!/usr/sbin/nft -f
# /etc/nftables.conf on the IPS sensor (10.10.30.21)
# - Default deny on input and forward
# - New web connections are DNATed to the WAF and handed to Suricata via NFQUEUE 0
# - SNAT keeps the return path symmetric (WAF replies come back through the sensor)
flush ruleset

table inet filter {
  set mgmt { type ipv4_addr; elements = { 172.16.0.2, 10.10.10.14 } }

  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    ip protocol icmp accept
    ip saddr @mgmt tcp dport 22 accept
    limit rate 5/second log prefix "FW-ids-DROP " level info
    drop
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
    # Every forwarded packet of an allowed flow goes through Suricata
    ct state established,related queue num 0
    ip daddr 10.10.30.20 tcp dport { 80, 8081 } ct state new queue num 0
    limit rate 5/second log prefix "FW-ids-FWD-DROP " level info
    drop
  }
}

table ip nat {
  chain prerouting {
    type nat hook prerouting priority -100;
    ip daddr 10.10.30.21 tcp dport 80   dnat to 10.10.30.20:80
    ip daddr 10.10.30.21 tcp dport 8081 dnat to 10.10.30.20:8081
  }
  chain postrouting {
    type nat hook postrouting priority 100;
    # Without this the WAF answers the client directly, bypassing the sensor
    ip daddr 10.10.30.20 tcp dport { 80, 8081 } snat to 10.10.30.21
  }
}
