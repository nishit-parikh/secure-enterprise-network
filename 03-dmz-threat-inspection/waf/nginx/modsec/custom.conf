# /etc/nginx/modsec/custom.conf - custom signatures on top of the OWASP CRS
# IDs 100001-100005 are in the local-use range and never collide with CRS rule IDs.

SecRule ARGS "@rx (?i)union(\s|/\*.*?\*/)+select" "id:100001,phase:2,deny,status:403,log,msg:'CUSTOM-WAF SQLi union select'"
SecRule ARGS|REQUEST_BODY "@rx (?i)<script[^>]*>" "id:100002,phase:2,deny,status:403,log,msg:'CUSTOM-WAF XSS script tag'"
SecRule ARGS "@rx (\.\./|\.\.%2f)" "id:100003,phase:2,deny,status:403,log,msg:'CUSTOM-WAF path traversal'"
SecRule ARGS "@rx (?i)(;|\||`|\$\()\s*(id|whoami|cat|nc|bash|sh)\b" "id:100004,phase:2,deny,status:403,log,msg:'CUSTOM-WAF command injection'"
SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(sqlmap|nikto|hydra|wpscan)" "id:100005,phase:1,deny,status:403,log,msg:'CUSTOM-WAF scanner user agent'"
