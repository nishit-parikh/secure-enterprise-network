# /etc/modsecurity/modsecurity.conf
# The Ubuntu 24.04 package ships no modsecurity.conf-recommended, so this base
# config was written by hand. SecDefaultAction lines are deliberately absent:
# they clash with the OWASP CRS ("SecDefaultActions can only be placed once per phase").

SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html text/xml
SecResponseBodyLimit 524288
SecTmpDir /tmp/
SecDataDir /tmp/

# Audit log: only "relevant" transactions (5xx and 4xx except 404)
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/modsec_audit.log

SecArgumentSeparator &
SecCookieFormat 0
SecPcreMatchLimit 100000
SecPcreMatchLimitRecursion 100000
