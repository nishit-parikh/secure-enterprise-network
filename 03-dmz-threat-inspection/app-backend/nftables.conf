#!/usr/sbin/nft -f
# /etc/nftables.conf on the Docker backend host (10.10.30.22)
# Apply with:  sudo nft -c -f /etc/nftables.conf && sudo nft -f /etc/nftables.conf && sudo systemctl restart docker
# (restart Docker after every reload: "flush ruleset" removes Docker's own chains)
flush ruleset

table inet filter {
  set mgmt { type ipv4_addr; elements = { 172.16.0.2, 10.10.10.14 } }

  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    ip protocol icmp accept
    ip saddr @mgmt tcp dport 22 accept
    ip saddr 10.10.30.20 tcp dport { 8080, 3000 } accept   # from the WAF only
    log prefix "FW-targets-DROP " drop
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
    # Published container ports are forwarded through the docker0 bridge
    ct state established,related accept
    iifname "docker0" accept
    oifname "docker0" accept
  }

  chain output {
    type filter hook output priority 0; policy drop;
    oif lo accept
    ct state established,related accept
    udp dport 53 accept
    udp dport 123 accept
    tcp dport { 80, 443 } accept
    ip protocol icmp accept
  }
}
